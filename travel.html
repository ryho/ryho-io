<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="A software engineer's personal site and interactive travel atlas." />
<title>Travel Atlas — ryho.io</title>
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
:root{color-scheme:dark;--bg:#0d1217;--fg:#edf3f4;--sub:#a5b4b9;--line:#304149;--accent:#a1e7bd;--card:#152029}*{box-sizing:border-box}
body{margin:0;font:16px/1.55 -apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif;background:var(--bg);color:var(--fg)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{width:min(1140px,calc(100% - 36px));margin:auto}
nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;gap:20px}.brand{font-weight:800;letter-spacing:-.035em;color:white;font-size:23px}nav .links{display:flex;gap:22px;font-size:14px;color:var(--sub)}
nav .links a{color:var(--sub)}main{padding-top:50px}h1{font-weight:750;letter-spacing:-.045em;line-height:1.09;font-size:clamp(36px,6.2vw,75px);max-width:920px;margin:0 0 23px}h2{font-size:32px;letter-spacing:-.025em;margin:0 0 12px}p{color:var(--sub);max-width:750px}.eyebrow{font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);font-weight:700}
.lead{font-size:19px;margin:0 0 32px}.hero{padding-bottom:62px}.tags{display:flex;gap:9px;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:#d1dcdf}
.mapsection{border-top:1px solid var(--line);padding:45px 0}.maptop{display:flex;justify-content:space-between;gap:20px;align-items:end;flex-wrap:wrap}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0 13px}select,button{color:var(--fg);background:var(--card);border:1px solid #46545c;border-radius:9px;padding:10px 15px;font:inherit;cursor:pointer}button:hover{border-color:var(--accent)}#map{height:clamp(520px,80vh,960px);border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#16232b;width:100vw;max-width:none;margin-left:calc(50% - 50vw);border-radius:0;border-left:0;border-right:0}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin:13px 0}.dot{display:inline-block;background:var(--accent);width:10px;height:10px;border-radius:99px;margin-right:5px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-bottom:65px}.card{border:1px solid var(--line);background:var(--card);padding:23px;border-radius:13px}.card strong{display:block;font-size:20px}.card p{font-size:14px;margin:8px 0 0}footer{padding:30px 0 65px;border-top:1px solid var(--line);color:var(--sub);font-size:13px}
.leaflet-control-attribution{font-size:11px!important} @media(max-width:670px){.cards{grid-template-columns:1fr}main{padding-top:22px}.lead{font-size:17px}nav .links{gap:12px}}

html,body{width:100%;height:100%;overflow:hidden}body{display:flex;flex-direction:column;height:100dvh}
.atlas-nav{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);gap:16px}.atlas-nav a{color:var(--fg)}
.atlas-shell{display:grid;grid-template-columns:330px minmax(0,1fr);flex:1;min-height:0;overflow:hidden}
.atlas-sidebar{min-height:0;overflow:auto;padding:20px;border-right:1px solid var(--line);overscroll-behavior:contain}
.atlas-sidebar h1{font-size:24px;margin:0 0 8px}.atlas-sidebar .controls{margin:16px 0;gap:8px}
.atlas-sidebar #location-list{columns:1!important;margin-bottom:0}.atlas-sidebar #location-list li{break-inside:avoid}
.atlas-canvas{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#map{flex:1;width:100%;height:100%;min-height:0;margin:0;border:0;border-radius:0}
.legend{flex:none;margin:0;padding:3px 12px;gap:12px;border-top:1px solid var(--line);font-size:11px;line-height:1.2}
@media(max-width:700px){.atlas-shell{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,30dvh) minmax(0,1fr)}.atlas-sidebar{border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}.atlas-sidebar h1{font-size:19px}.atlas-sidebar .eyebrow{display:none}.atlas-nav{padding:8px 16px}.atlas-sidebar .controls{margin:10px 0}.legend{font-size:10px;padding:3px 10px;gap:8px}}
@media(min-width:701px){.atlas-date-range{display:block}#category-options{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10px!important}#category-options>label:nth-child(n+3){grid-column:1 / -1}}
#trip-playback{margin:14px 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.trip-playback-buttons,.trip-playback-settings{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.trip-playback-buttons button{font-size:14px;padding:8px 10px}
#trip-playback-options[hidden],#stop-trip[hidden]{display:none}.trip-progress-label{display:block;font-size:12px;margin-top:12px}#trip-progress{display:block;width:100%;margin:6px 0;accent-color:var(--accent)}
.trip-playback-settings{font-size:12px;justify-content:space-between}#trip-speed{font-size:12px;padding:4px}#trip-playback-status{display:block;font-size:12px;color:var(--sub);margin-top:8px;min-height:2.8em}.playback-place-names{display:flex;flex-direction:column;align-items:flex-end;pointer-events:none;max-width:min(360px,calc(100vw - 100px))}.playback-place-name{display:grid;grid-template-rows:1fr;animation:playback-name-life 8.6s ease both;width:100%}.playback-name-clip{min-height:0;overflow:hidden}.playback-name-button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:0 0 7px;padding:9px 14px;background:rgba(13,18,23,.94);color:#edf3f4;border:1px solid #a1e7bd66;border-radius:9px;font-size:15px;font-weight:650;box-shadow:0 3px 14px #0003;pointer-events:auto;cursor:pointer}.playback-name-button img{width:32px;height:38px;object-fit:contain;flex-shrink:0}.playback-name-button:hover,.playback-name-button:focus-visible{border-color:#a1e7bd;background:#1b2b31}@keyframes playback-name-life{0%{opacity:0;grid-template-rows:0fr;transform:translateY(-16px)}7%,91%{opacity:1;grid-template-rows:1fr;transform:none}100%{opacity:0;grid-template-rows:0fr;transform:translateY(-20px)}}

.trip-vehicle{background:none;border:none}.trip-vehicle img{display:block;width:100%;height:100%;object-fit:contain}
.photo-popup .leaflet-popup-content{width:min(400px,calc(100vw - 76px))!important;max-height:calc(100dvh - 150px);overflow:auto}
.place-photo-button{display:block;width:100%;padding:0;border:0;margin:10px 0 0;background:none;cursor:zoom-in;border-radius:8px}.place-photo-button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.place-photo{display:block;width:100%;height:auto;max-height:min(380px,48dvh);object-fit:contain;border-radius:8px;background:#132029}
.place-photo-viewer{max-width:96vw;max-height:96dvh;padding:12px 16px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);overflow:auto}.place-photo-viewer::backdrop{background:rgba(0,0,0,.88)}
.place-photo-header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:10px}.place-photo-header h2{font-size:17px;line-height:1.3;letter-spacing:0;margin:0}.place-photo-header button{font-size:26px;line-height:1;padding:6px 10px}
.place-photo-viewer>img{display:block;max-width:calc(96vw - 34px);max-height:calc(96dvh - 90px);width:auto;height:auto;object-fit:contain;margin:auto}
.trip-mileage{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;font-size:13px;color:var(--sub)}#trip-miles{font-size:21px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.location-search-label{display:block;font-size:13px;color:var(--sub);margin:16px 0 6px}#location-search{display:block;width:100%;min-width:0;padding:9px 11px;font:inherit;font-size:14px;color:var(--fg);background:var(--card);border:1px solid #46545c;border-radius:9px}#location-search:focus{outline:2px solid var(--accent);outline-offset:1px}
</style><script src="data/place-names-es.js"></script><script src="data/place-names-fr.js"></script><script src="assets/i18n.js"></script><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" /></head><body>
<header class="atlas-nav"><a href="index.html" class="brand">ryho.io</a><span data-i18n="Travel Atlas">Travel Atlas</span><label style="display:flex;gap:6px;align-items:center;font-size:13px"><span data-i18n="Language">English / Español</span><select data-language-select aria-label="Language / Idioma / Langue" style="font-size:13px;padding:5px"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></label></header>
<div class="atlas-shell"><aside class="atlas-sidebar" aria-label="Travel controls"><p class="eyebrow" data-i18n="Travel Atlas">Travel Atlas</p><h1><span data-i18n="My real location data">My real location data</span> <span class="atlas-date-range" data-i18n="July 2025 to Oct. 2026">July 2025 to Oct. 2026</span></h1><div style="display:flex;align-items:center;gap:8px;margin-top:16px"><label for="country" data-i18n="Region:">Region:</label><select id="country"><option value="us" selected data-i18n="United States">United States</option><option value="us-southwest" data-i18n="Southwest US">Southwest US</option><option value="us-northwest" data-i18n="Northwest US">Northwest US</option><option value="us-upper-midwest" data-i18n="Upper Midwest US">Upper Midwest US</option><option value="hawaii" data-i18n="Hawaii">Hawaii</option><option value="canada" data-i18n="Canada">Canada</option><option value="japan" data-i18n="Japan">Japan</option><option value="nicaragua" data-i18n="Nicaragua">Nicaragua</option><option value="all" data-i18n="World">World</option></select></div><div class="controls"><label for="month" data-i18n="Month:">Month:</label><select id="month"><option value="all" data-i18n="Entire trip">Entire trip</option></select></div>
<section id="trip-playback" aria-label="Trip playback">
<div class="trip-mileage"><span data-i18n="Miles traveled">Miles traveled</span><output id="trip-miles" aria-live="off">—</output></div>
<div class="trip-playback-buttons"><button id="play-trip" type="button">▶ Play trip</button><button id="stop-trip" type="button" hidden>■ Stop trip</button></div>
<div id="trip-playback-options" hidden>
<label class="trip-progress-label"><span data-i18n="Progress">Progress</span><input id="trip-progress" type="range" min="0" max="1000" step="1" value="0" aria-label="Trip progress"></label>
<div class="trip-playback-settings"><label><span data-i18n="Speed">Speed</span> <select id="trip-speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select></label></div>
<output id="trip-playback-status" aria-live="off"></output>
</div></section>

<fieldset id="category-filters" style="border:0;padding:0;margin:12px 0"><legend data-i18n="Show locations">Show locations</legend><div id="category-options" style="display:flex;flex-wrap:wrap;gap:12px"></div></fieldset>
<label style="display:flex;gap:8px;align-items:center;margin:12px 0;font-size:14px"><input type="checkbox" id="show-holiday-trips"><span data-i18n="Show Trips Back Home">Show Trips Back Home</span></label>
<label for="location-search" class="location-search-label" data-i18n="Search locations">Search locations</label>
<input id="location-search" type="search" placeholder="Name or place…" data-i18n-placeholder="Name or place…" aria-controls="location-list" autocomplete="off">
<ul id="location-list" style="margin:10px 0 16px;list-style:none;padding-left:0"></ul>
</aside><main class="atlas-canvas" style="padding:0"><div id="map" role="region" aria-label="Interactive map of travels"></div><div class="legend"><span><i class="dot" style="background:#007A78"></i><span data-i18n="Ground travel">Ground travel</span></span><span><i class="dot" style="background:#B53670"></i><span data-i18n="Flights">Flights</span></span><span><i class="dot" style="background:#7546D9"></i><span data-i18n="Bullet train">Bullet train</span></span><span><i class="dot" style="background:#687583"></i><span data-i18n="Missing data">Missing data</span></span></div></main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="assets/vendor/tz-lookup.js"></script>
<script src="data/transport-overrides.js"></script>
<script src="data/country-boundaries.js"></script>
<script src="data/travel-paths.js"></script>
<script src="data/visited-parks.js"></script>
<script src="data/travel-highlights.js"></script>
<script src="data/destination-blurbs.js"></script>
<script src="assets/travel-map.js"></script><script src="assets/trip-playback.js"></script></body></html>
